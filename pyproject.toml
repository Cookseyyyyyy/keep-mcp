[project]
name = "keep-mcp"
version = "0.1.0"
description = "MCP server for a personal Google Keep account: read lists, add items, and check them off."
authors = [{ name = "Cookseyyyyy", email = "mcooksey@gmail.com" }]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.12.0,<2",
    "gkeepapi>=0.16.0",
    "gpsoauth>=1.1.1",
    "uvicorn>=0.32.0",
    "starlette>=0.41.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0,<0.16",
]

[project.scripts]
keep-mcp = "keep_mcp.server:main"
keep-mcp-http = "keep_mcp.http:main"
keep-mcp-token = "keep_mcp.token_setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keep_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
